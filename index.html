<!DOCTYPE html>
<html lang="id"><head data-own="">
<meta charset="utf-8" data-own="">
<meta name="viewport" content="width=device-width, initial-scale=1" data-own="">
<title data-own="">Link Regional Bali Nusra</title>
<link data-own="" rel="preconnect" href="https://fonts.googleapis.com">
<link data-own="" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style data-own="">
/* Layout: kartu hero bernuansa laut di atas putih, tab segmented, grup berjudul, link dengan ikon. */
:root{
  --bg:#ffffff; --ink:#4d4d4f; --muted:#727275; --line:#e8e8ea; --soft:#f5f5f6;
  --accent:#32bcad; --accent-ink:#232326; --accent-text:#1f756b;
  --danger:#ed1c24; --warn:#8a5200; --warn-soft:#fdf0d5;
  --display:"Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink)}
#app{font:15px/1.55 var(--body);-webkit-text-size-adjust:100%;--accent-soft:color-mix(in srgb,var(--accent) 9%,#fff);--accent-mid:color-mix(in srgb,var(--accent) 20%,#fff)}
.wrap{max-width:520px;margin:0 auto;padding:12px 18px 56px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,#fff);outline-offset:2px}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}

#bar{min-height:8px}
.editbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px rgba(13,21,25,.08)}
.editbar .lbl{flex:1;min-width:0;line-height:1.25;font-size:14px}
.editbar .lbl small{display:block;color:var(--muted);font-size:12px}

.hero{position:relative;overflow:hidden;margin-top:4px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px}
.al-left .hero{text-align:left}
.cover{position:relative;height:132px;overflow:hidden;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 56%,#000))}
.cover.c-solid{background:var(--accent)}
.cover.c-photo{background:var(--soft)}
.cover .cv,.cover img{position:absolute;inset:0;width:100%;height:100%}
.cover img{object-fit:cover}
.cover.c-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.2))}
.cover-btn{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.95)}
.id{padding:0 22px 26px}
.avwrap{position:relative;width:84px;height:84px;margin:-42px auto 14px}
.al-left .avwrap{margin-left:0}
.avatar{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 20px rgba(13,21,25,.16)}
.avatar.sq{border-radius:24px}
.avatar.mark{background:var(--accent)}
.avatar img{width:100%;height:100%;object-fit:contain;background:#fff}
.avatar svg{width:100%;height:100%}
.avatar .ini{font:800 28px var(--display);color:var(--accent-ink);letter-spacing:-.02em}
.avatar.pic,.avatar.pic.sq,.nocover .avatar.pic,.nocover .avatar.pic.sq{border:0;border-radius:0;box-shadow:none;background:transparent;overflow:visible}
.avatar.pic img{background:transparent;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(13,21,25,.2))}
.avwrap.pic{width:104px;height:104px}
.nocover .avwrap.pic{width:108px;height:108px;margin-bottom:14px}
.fab{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;padding:0;display:grid;place-items:center;border-radius:50%;border:2px solid #fff;background:var(--ink);color:#fff;cursor:pointer}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 8px;font:700 11px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text)}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent)}
.al-left .eyebrow{justify-content:flex-start}
.al-left .eyebrow::before{display:none}
h1{margin:0 0 10px;font:800 clamp(30px,9vw,40px)/1.06 var(--display);letter-spacing:-.035em;text-wrap:balance;color:var(--ink)}
.sub{margin:0 auto 16px;color:var(--muted);max-width:40ch;text-wrap:balance}
.al-left .sub{margin-left:0}
.regions{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.al-left .regions{justify-content:flex-start}
.regions li{display:flex;align-items:center;gap:7px;padding:3px 11px 3px 9px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600}
.regions li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.id .btn{margin-top:16px}


/* ---- kartu header (tanpa cover): latar bernuansa aksen, lingkaran halus, angka ringkas ---- */
.hero.nocover{overflow:hidden;margin-top:0;border:1px solid color-mix(in srgb,var(--accent) 16%,#fff);border-radius:28px;background:linear-gradient(160deg,var(--accent-soft),#fff 65%)}
.nocover .id{position:relative;padding:24px 20px 20px}
.nocover .id > *:not(.deco){position:relative}
.nocover .id > .dots{position:absolute;top:26px;right:22px;display:flex;gap:7px}
.nocover .dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.nocover .deco{position:absolute;top:0;right:0;width:210px;height:210px;pointer-events:none}
.nocover .avwrap{width:58px;height:58px;margin:0 auto 18px}
.al-left .nocover .avwrap{margin-left:0}
.nocover .avatar{border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 24%,transparent)}
.nocover .avatar.sq{border-radius:18px}
.nocover .avatar .ini{font-size:22px}
.nocover .eyebrow{gap:8px;margin:0 0 10px;letter-spacing:.18em}
.nocover .eyebrow::before{width:7px;height:7px;border-radius:50%}
.nocover .eyebrow::after{display:none}
.nocover h1{margin:0 0 10px;font-size:clamp(34px,10.5vw,44px)}
h1 .hl{color:color-mix(in srgb,var(--accent) 82%,#000)}
.nocover .sub{margin-bottom:16px}
.nocover .regions li{background:#fff}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:22px;padding:14px 0;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 14%,#fff);border-radius:18px;text-align:center}
.stat{line-height:1.25;min-width:0}
.stat b{display:block;font:800 22px var(--display);letter-spacing:-.02em;color:var(--ink)}
.stat span{font-size:12px;font-weight:500;color:var(--muted)}
.stat + .stat{border-left:1px solid var(--line)}

.search{position:relative;margin-top:22px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;padding:12px 16px 12px 44px;border:1px solid transparent;border-radius:12px;background:var(--soft)}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:#fff;border-color:var(--accent)}

.tabs{display:flex;gap:6px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:8px 16px;background:transparent;border:0;border-radius:99px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:not(.on):not(.ph):hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab .count{font-size:12px;font-weight:600;opacity:.6}
.tab.add{color:var(--accent-text)}
@media (max-width:480px){.tab{padding:8px 13px}.tab:not(.on):not(.add) .count{display:none}}

.sec{margin-top:4px}
.sec + .sec{margin-top:26px}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.grp{margin-top:30px}
.grp-h{margin-bottom:10px}
.grp-top{display:flex;align-items:center;gap:8px}
.grp-title{margin:0;font:700 12px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grp-title.none{font-weight:500;text-transform:none;letter-spacing:0;font-style:italic}
.grp-count{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.empty.small{margin:8px 0}
.btn.grpadd{margin-top:30px}

.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;align-items:center;gap:14px;min-width:0;padding:12px 14px 12px 12px;color:var(--ink);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .15s,background .15s}
a.lnk:hover{border-color:color-mix(in srgb,var(--accent) 50%,#fff);background:var(--accent-soft)}
.ico{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-text)}
.ico svg{width:20px;height:20px}
.ico.pic{padding:0;overflow:hidden;background:#fff;border:1px solid var(--line)}
.ico.pic img{width:100%;height:100%;object-fit:cover;display:block}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}
.tx b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tx small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.go{flex:none;display:grid;place-items:center;color:#aaaaad;transition:transform .15s,color .15s}
a.lnk:hover .go{color:var(--accent-text);transform:translateX(2px)}
.pill{flex:none;font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 10px}
.lnk.off{cursor:default}

.st-daftar .items{gap:0}
.st-daftar .lnk{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px}
.st-daftar a.lnk:hover{background:transparent}
.st-daftar a.lnk:hover .tx b{color:var(--accent-text)}
.st-daftar .item.edit .lnk{padding:10px 4px}

.st-tombol .lnk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-tombol .ico{background:rgba(255,255,255,.18);color:inherit}
.st-tombol .ico.pic{background:#fff;border-color:rgba(255,255,255,.4)}
.st-tombol .tx small{color:inherit;opacity:.8}
.st-tombol .go{color:inherit;opacity:.85}
.st-tombol a.lnk:hover{background:var(--accent);filter:brightness(1.08)}
.st-tombol .pill{background:rgba(255,255,255,.2);color:inherit}
.st-tombol .lnk.off{background:#fff;border-color:var(--line);color:var(--ink)}
.st-tombol .lnk.off .ico{background:var(--accent-soft);color:var(--accent-text)}
.st-tombol .lnk.off .pill{background:var(--soft);color:var(--muted)}

.btn.add{margin-top:12px;width:100%;border-style:dashed;color:var(--muted);padding:12px;border-radius:14px}
.btn.add:hover{color:var(--accent-text)}
.empty{text-align:center;color:var(--muted);margin:32px 0}
footer{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
footer.left{flex-direction:row-reverse}
.foot-t{min-width:0}
.brand{display:block;height:32px;width:auto;max-width:48%;object-fit:contain}
.fnote{margin:0 0 2px;font-size:12px;color:var(--muted)}
.adm{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 0;border-radius:8px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.adm:hover{color:var(--ink);background:var(--soft)}


/* ---- mode admin: pegangan geser di kiri, tombol ikon di kanan ---- */
.grip{flex:none;display:grid;place-items:center;width:24px;padding:0;border:0;border-radius:8px;background:transparent;color:#a3a3a6;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip:hover{color:var(--accent-text);background:var(--accent-soft)}
.grip:active{cursor:grabbing}
.tab .tabgrip{width:16px;height:20px;margin-left:-4px;border-radius:6px;cursor:grab}
.tab.on .tabgrip{color:inherit;opacity:.7}
.ibs{display:flex;gap:4px;flex:none}
.ibs.grid{display:grid;grid-template-columns:repeat(2,28px);gap:4px;align-self:center}
.ib{width:28px;height:28px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.ib:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.ib.danger:hover{border-color:var(--danger);color:var(--danger);background:#fdecea}
.item.edit{flex-direction:row;align-items:stretch;gap:6px}
.item.edit .lnk{flex:1;min-width:0;cursor:pointer;padding:10px 12px 10px 10px;gap:12px}
.item.edit .lnk:hover{border-color:color-mix(in srgb,var(--accent) 45%,#fff)}
.item.edit .ico{width:40px;height:40px;border-radius:12px}
.item.edit .tx b{font-size:14px}
.item.edit .pill{padding:2px 8px}
.item.edit .grip{align-self:center;height:36px}
.secbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 2px;padding:8px 10px 8px 14px;border:1px dashed var(--line);border-radius:14px;background:var(--soft)}
.sb-label{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-label b{color:var(--ink);font-weight:700}
.grp-top.edit{gap:6px}
.grp-top.edit .grp-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-top.edit .ibs{margin-left:auto}
.grp-top.edit .grp-count{margin-left:0}
.grp-top.edit .grip{height:30px}
.dragging,.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.dragsrc{position:absolute!important;left:-9999px;top:0;width:1px!important;height:1px!important;overflow:hidden;opacity:0;margin:0!important}
.ph{box-sizing:border-box;border:2px dashed color-mix(in srgb,var(--accent) 55%,#fff)!important;background:var(--accent-soft)!important;border-radius:18px;box-shadow:none!important;transform:none!important;animation:none!important}
.tab.ph{flex:none;padding:0;border-radius:12px}
.ph > *{display:none!important}
.dgh{position:fixed!important;z-index:60;margin:0!important;pointer-events:none;list-style:none;box-shadow:0 20px 44px rgba(13,21,25,.28)!important;opacity:.97;transform:scale(1.02) rotate(-.7deg);transition:none;animation:none!important;background:#fff}
.tab.dgh{background:var(--accent);color:var(--accent-ink);border-radius:12px;display:flex}
.grp.dgh{background:#fff;border-radius:18px;padding:10px;border:1px solid var(--line)}
.items:empty{min-height:8px}
.dragging .items:empty{min-height:58px;border:2px dashed var(--line);border-radius:16px}

@keyframes rise{from{transform:translateY(10px)}}
.anim .grp-top,.anim .item{animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0) * 30ms)}

.ov{position:fixed;inset:0;z-index:20;background:rgba(13,21,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;width:min(100%,460px);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 24px 60px rgba(13,21,25,.3)}
.dlg h2{margin:0 0 4px;font:700 20px var(--display);letter-spacing:-.01em}
.dlg p{margin:6px 0 0;color:var(--muted);font-size:14px}
.dlg label,.dlg .lab{display:block;margin:16px 0 6px;font-size:13px;font-weight:600}
.dlg input[type=text],.dlg input[type=password],.dlg textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.dlg textarea{resize:vertical;min-height:64px}
.dlg .err{color:var(--danger);font-size:14px;margin-top:10px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:#fff;border:0;border-right:1px solid var(--line);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.imgrow{display:flex;align-items:center;gap:14px}
.imgprev{flex:none;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;overflow:hidden;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--line)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgctl{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.imgctl input[type=file]{font-size:13px;max-width:100%}
.logorow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.logorow input[type=file]{font-size:13px;max-width:100%}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;display:none;z-index:30;max-width:90vw}
#toast.show{display:block}
@media (prefers-reduced-motion:reduce){.lnk,.tab,.go{transition:none}.anim .grp-top,.anim .item{animation:none}a.lnk:hover{transform:none}}
</style>
</head>

  function readImage(file, max, mime, quality, cb) {
    if (file.size > 8 * 1024 * 1024) { toast('Ukuran gambar maksimal 8 MB.'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var r = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        var cx = c.getContext('2d');
        if (mime === 'image/jpeg') { cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); }
        cx.drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL(mime, quality));

        } else {

          var plan = [], seen = 0, ok = true;

    e.preventDefault();
    d.x = e.clientX; d.y = e.clientY;
    d.ghost.style.left = (d.x - d.offX) + 'px'; d.ghost.style.top = (d.y - d.offY) + 'px';
    dragPlace(d.x, d.y);
  }

  app.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('[data-drag]');
    if (!g || !editing || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var kind = g.dataset.drag;
    var src = kind === 'item' ? g.closest('li.item') : (kind === 'group' ? g.closest('.grp') : g.closest('.tab'));
    if (!src) return;
    e.preventDefault();
    drag = { kind: kind, src: src, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, started: false };
    window.addEventListener('pointermove', dragMove, { passive: false });
    window.addEventListener('pointerup', dragUp);
    window.addEventListener('pointercancel', dragCancel);
  });

  document.getElementById('q').addEventListener('input', function (e) { query = e.target.value; renderList(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.innerHTML) closeModal();
    else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('lnk') && e.target.dataset.a) { e.preventDefault(); e.target.click(); }
  });

  renderAll();

  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) { cap = a || null; }).catch(function () { cap = null; });
  }
})();
</script>
